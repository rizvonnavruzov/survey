<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Survey</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 40px 48px;
      width: 100%;
      max-width: 440px;
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .card p.subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input[type="text"]:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button[type="submit"]:hover {
      opacity: 0.92;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 0 4px;
      color: #38a169;
      font-weight: 600;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Student Registration</h1>
    <p class="subtitle">Please enter your details below.</p>

    <!--
      OPTION A (Formspree): Replace YOUR_FORMSPREE_ID with your Formspree form ID.
      OPTION B (Google Apps Script): Replace the action URL below with your deployed Apps Script URL.
    -->
    <form
      id="survey-form"
      action="https://formspree.io/f/YOUR_FORMSPREE_ID"
      method="POST"
    >
      <label for="first_name">First Name</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        placeholder="Enter your first name"
        required
        autocomplete="given-name"
      />

      <label for="surname">Surname</label>
      <input
        type="text"
        id="surname"
        name="surname"
        placeholder="Enter your surname"
        required
        autocomplete="family-name"
      />

      <!-- Hidden field so Formspree uses a clear subject line in the email -->
      <input type="hidden" name="_subject" value="New survey response" />

      <button type="submit">Submit</button>
    </form>

    <p class="success-msg" id="success-msg">Thank you! Your response was recorded.</p>
  </div>

  <script>
    const form = document.getElementById('survey-form');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const isAppsScript = form.action.includes('script.google.com');

      try {
        if (isAppsScript) {
          // Google Apps Script doesn't support CORS, so we use no-cors.
          // The request still goes through; we just can't read the response.
          await fetch(form.action, { method: 'POST', body: data, mode: 'no-cors' });
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          const response = await fetch(form.action, {
            method: 'POST',
            body: data,
            headers: { Accept: 'application/json' },
          });
          if (response.ok) {
            form.style.display = 'none';
            successMsg.style.display = 'block';
          } else {
            alert('Something went wrong. Please try again.');
          }
        }
      } catch {
        alert('Something went wrong. Please try again.');
      }
    });
  </script>
</body>
</html>
